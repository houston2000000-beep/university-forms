<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge — Job Board | Find & Post Jobs</title>
  <meta name="description" content="Forge is a clean job board to find open roles and post jobs. Full-time, remote, contract, and internship listings." />
  <meta name="robots" content="index, follow" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="container header-inner">
        <a href="/" class="logo" data-link>Forge</a>
        <nav class="nav" id="nav">
          <a href="/" data-link>Jobs</a>
          <a href="/post" data-link class="nav-post hidden" id="nav-post">Post a job</a>
          <a href="/my-jobs" data-link class="hidden" id="nav-my">My jobs</a>
          <button class="btn btn-ghost hidden" id="btn-logout">Log out</button>
          <button class="btn btn-primary" id="btn-auth">Log in</button>
        </nav>
      </div>
    </header>
    <main class="main" id="main"></main>
    <footer class="footer">
      <div class="container"><span>Forge · post jobs, find work</span></div>
    </footer>
  </div>

  <div class="modal-overlay hidden" id="auth-modal">
    <div class="modal">
      <button class="modal-close" id="auth-close">&times;</button>
      <div class="modal-tabs">
        <button class="tab active" data-tab="login">Log in</button>
        <button class="tab" data-tab="register">Register</button>
      </div>
      <form id="login-form" class="auth-form">
        <label>Email<input type="email" name="email" required /></label>
        <label>Password<input type="password" name="password" required minlength="6" /></label>
        <p class="form-error hidden" id="login-error"></p>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>
      <form id="register-form" class="auth-form hidden">
        <label>Name<input type="text" name="name" required /></label>
        <label>Email<input type="email" name="email" required /></label>
        <label>Password<input type="password" name="password" required minlength="6" /></label>
        <p class="form-error hidden" id="register-error"></p>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
